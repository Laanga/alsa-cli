[project]
name = "alsa-cli"
version = "0.1.0"
description = "Alsa bus timetables and fares from the terminal: a TUI, a CLI with JSON output and an MCP server. No account needed."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "typer>=0.15",
    "rich>=13",
    "curl-cffi>=0.7.4",
    "textual>=8.2.8,<9",
]

[project.scripts]
alsa = "alsa.cli:main"
alsa-mcp = "alsa.mcp:main"

[project.optional-dependencies]
mcp = ["fastmcp>=3.2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alsa"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
